name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      # Plogon builds against Dalamud itself, so the same libraries are fetched
      # here rather than assuming a game install. DALAMUD_HOME is what the SDK
      # looks at, and setting it is also what switches the project off its local
      # devPlugins output path.
      - name: Fetch Dalamud
        shell: pwsh
        run: |
          $home_dir = Join-Path $env:RUNNER_TEMP "dalamud"
          New-Item -ItemType Directory -Force $home_dir | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "$home_dir.zip"
          Expand-Archive -Path "$home_dir.zip" -DestinationPath $home_dir -Force
          "DALAMUD_HOME=$home_dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        run: dotnet build PlogDock/PlogDock.csproj -c Release --nologo

      - name: Upload packaged plugin
        uses: actions/upload-artifact@v4
        with:
          name: PlogDock
          path: PlogDock/bin/Release/PlogDock/

  submission:
    name: D17 submission
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fails when the csproj version has no changelog section, when that section
      # is empty, when a newer section sits above it, or when the icon is not a
      # square PNG between 64 and 512 pixels. None of those should reach a
      # release, and all of them are cheaper to catch here than in review.
      - name: Build submission
        run: python .github/scripts/build_manifest.py --out submission

      # Uploaded from the staging directory so the archive is rooted at the
      # channel: unzipping it over a clone of DalamudPluginsD17 drops the files
      # exactly where they belong, with nothing to move by hand.
      - name: Upload submission
        uses: actions/upload-artifact@v4
        with:
          name: submission
          path: submission/
